# Derived from configs/micro_ordtext_mixed_v4_cpu.yaml; only training.device and training.output_dir differ.
model:
  name: tamev_micro_minilm
  size_profile: micro
  model_type: encoder
  backbone: sentence-transformers/all-MiniLM-L6-v2
  hidden_dim: null
  projection_dim: 64
  temperature: 2.0
  freeze_embeddings: false
  pooling: mean
teacher:
  name: agent-teacher
  provider: agent
  model_path: agent-teacher
  device: cuda
  temperature: 2.0
  batch_size: 8
  max_samples: 1500
  cache_dir: runs/agent_teacher_cache.json
  api_key: null
dataset:
  name: canonical
  # The only variable vs the shipped micro recipe (configs/micro_w10_t4.yaml): the score cells'
  # option text, plus the corrected-agnews labels. 4,175 of the 19,999 gate rows (20.9%) move from
  # synthetic 'Rating 0..4' to ordinal strings ('1 star - terrible' .. '5 stars - excellent');
  # those are exactly the K=5 cells, and only their option strings change (labels and row ids are
  # byte-identical). The agnews is_* cells are relabelled from each article's own topic row too.
  # Grade on BOTH instruments -- test_v3_core_v4 (frozen synthetic text) and test_v3_core_ordtext_v4
  # (real option text, the serving contract); a win on one that loses the other is not a win.
  train_path: runs/research/hf_v2/train_v3_mixed_v4.jsonl
  val_path: runs/research/hf_v2/val_v3_select_mixed_v4.jsonl
  test_path: runs/research/hf_v2/test_v3_core_ordtext_v4.jsonl
  max_ctx_len: 128
  max_opt_len: 48
  max_options: null
  format: jsonl
training:
  stage: distill_rl
  epochs: 3
  # bs 32 x full K (banking77 K=77) OOMed on the 2-vCPU/12 GiB CPU VM, so the arm runs 8 x 4 = 32:
  # same effective batch, one variable changed, not two.
  batch_size: 8
  gradient_accumulation_steps: 4
  # 1239 steps/epoch on CPU (~2 min/50 steps) killed a run every ~24 min at the default 400.
  resume_every: 200
  learning_rate: 3.0e-05
  weight_decay: 0.01
  optimizer: adamw
  kd_temperature: 2.0
  kd_weight: 1.0
  margin_gamma: 1.2
  margin_weight: 0.5
  brier_weight: 0.5
  kl_anchor_weight: 0.1
  device: mps
  output_dir: runs/research/micro_ordtext_mixed_mps
  seed: 42
  amp: true
export:
  precisions:
  - fp32
  - fp16
  - int8
  targets:
  - onnx
  - pytorch
  onnx_opset: 17
  output_dir: models/exported/micro
benchmark:
  suite_path: runs/research/hf_v2/test_v3_core_ordtext_v4.jsonl
  output_dir: runs/benchmarks
  batch_size: 32
  num_permutations: 4
  latency_warmup: 10
  latency_reps: 50
  remote_endpoint: null
server:
  host: 127.0.0.1
  port: 8008
  checkpoint_path: null
  device: cuda
target:
  snake_score: 500
  tetris_score: 2000
  top1_accuracy: 0.46
  top3_accuracy: 0.75
  max_ece: 0.05
  max_brier: 0.65
  max_latency_ms: 10.0


