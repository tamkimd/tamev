model:
  name: tamev_large_qwen4b
  size_profile: large
  model_type: causal
  backbone: Qwen/Qwen3.5-4B
  hidden_dim: null
  projection_dim: 512
  temperature: 1.5
  freeze_embeddings: false
  pooling: last
teacher:
  name: agent-teacher
  provider: agent
  model_path: agent-teacher
  device: auto
  temperature: 2.0
  batch_size: 4
  max_samples: 5000
  cache_dir: runs/agent_teacher_cache.json
  api_key: null
dataset:
  name: canonical
  train_path: data/processed/train_merged.jsonl
  val_path: data/processed/val.jsonl
  test_path: data/processed/test.jsonl
  max_ctx_len: 256
  max_opt_len: 64
  max_options: 16
  format: jsonl
training:
  stage: distill_rl
  epochs: 5
  batch_size: 4
  learning_rate: 1.0e-05
  weight_decay: 0.01
  optimizer: adamw
  kd_temperature: 2.0
  kd_weight: 1.2
  margin_gamma: 1.2
  margin_weight: 0.6
  brier_weight: 0.5
  kl_anchor_weight: 0.1
  device: auto
  output_dir: runs/tamev_large_qwen4b
  seed: 42
  early_stopping_patience: 3
  early_stopping_metric: val_top1
export:
  precisions:
  - bf16
  - int8
  targets:
  - onnx
  - pytorch
  onnx_opset: 17
  output_dir: models/exported/large_qwen4b
benchmark:
  suite_path: data/processed/test.jsonl
  output_dir: runs/benchmarks
  batch_size: 16
  num_permutations: 4
  latency_warmup: 10
  latency_reps: 50
  remote_endpoint: null
server:
  host: 127.0.0.1
  port: 8008
  checkpoint_path: null
  device: auto
target:
  snake_score: 500
  tetris_score: 2000
  top1_accuracy: 0.70
  top3_accuracy: 0.90
  max_ece: 0.035
  max_brier: 0.45
  max_latency_ms: 35.0
