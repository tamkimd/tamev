model:
  name: tamev_medium_qwen35_08b
  size_profile: medium
  model_type: incontext_causal
  backbone: Qwen/Qwen3.5-0.8B-Base
  init_from: jaredpalmer/kev-0.8b
  projection_dim: 256
  temperature: 2.351
  option_isolation: false
teacher:
  name: agent-teacher
  provider: agent
  model_path: agent-teacher
  device: auto
  temperature: 2.0
  batch_size: 4
  max_samples: 2000
  cache_dir: runs/agent_teacher_cache.json
  api_key: null
dataset:
  name: canonical
  train_path: data/processed/train_merged.jsonl
  val_path: data/processed/val.jsonl
  test_path: data/processed/test.jsonl
  max_ctx_len: 256
  max_opt_len: 64
  max_options: 4
  eval_max_options: 4
  format: jsonl
training:
  stage: distill_rl
  epochs: 3
  batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-05
  weight_decay: 0.01
  optimizer: adamw
  kd_temperature: 2.0
  kd_weight: 1.0
  margin_gamma: 1.2
  margin_weight: 0.5
  brier_weight: 0.5
  kl_anchor_weight: 0.1
  device: auto
  amp: true
  output_dir: runs/tamev_medium_qwen35_08b_large
  seed: 42
  early_stopping_patience: 3
  early_stopping_metric: composite
  early_stopping_min_delta: 0.001
export:
  precisions:
    - bf16
    - int8
  targets:
    - pytorch
    - coreml
    - mlx
  onnx_opset: 17
  output_dir: models/exported/medium_qwen35_08b
benchmark:
  suite_path: data/processed/test.jsonl
  output_dir: runs/benchmarks
  batch_size: 16
  num_permutations: 4
  latency_warmup: 5
  latency_reps: 20
  remote_endpoint: null
server:
  host: 127.0.0.1
  port: 8008
  checkpoint_path: null
  device: auto
